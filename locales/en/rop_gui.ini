[strings]
GuiRopSimulationNotice = "Read-only ROP simulation: a return consumes the first stack pointer, then instructions run in an isolated emulator. Stepping here never steps or changes the live target."
GuiRopAddressHint = "Hex address or $sp"
GuiRopInvalidAddress = "Enter a hexadecimal stack address (with or without 0x), or $sp."
GuiRopWorkerBusy = "The Python worker is busy or shutting down. Finish or cancel its current job before analyzing."
GuiRopEmpty = "Choose a stack address and Analyze. Each node is an execution occurrence, including repeated visits to the same code address."
GuiRopStopFirst = "Stop a target before analyzing a stack. Existing traces remain available for offline inspection."
GuiRopStale = "OFFLINE / STALE: the process, stop, thread, registers or patches changed, or source provenance could not be verified. Simulated stepping is available; live Follow actions are disabled."
GuiRopFresh = "Captured from the current stopped source. All values below are simulated, not live register or memory values."
GuiRopNoNodes = "No executable occurrence was recorded. The terminal diagnostic explains the boundary; no target was inferred."
GuiRopPreviousTrace = "Showing the previous trace while the latest request has no recorded result."
