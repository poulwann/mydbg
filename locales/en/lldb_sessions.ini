[strings]
LldbSessionUnsupported = "Some breakpoint resolvers cannot be saved by LLDB. Scripted resolvers and exception breakpoints created inside opaque scripts are not replayed."
LldbSessionUnresolved = "Some saved breakpoints remain unresolved; their records are retained until the matching module or resolver is available."
LldbSessionConditionInvalid = "A saved bounded breakpoint condition could not be compiled; its breakpoint was not restored."
LldbSessionUnsafeSkipped = "Transient breakpoints, command callbacks, thread IDs, hardware watchpoints, and execute-mode watches are not replayed."
LldbSessionLocationOptions = "LLDB does not serialize per-location breakpoint overrides; only the parent breakpoint options are saved."
LldbSessionWrongTarget = "The saved session no longer belongs to the active target, or durable sessions are unavailable."
LldbSessionUnavailable = "The active target does not have a writable saved session."
LldbSessionUnsafeAddress = "Only addresses in an identifiable file-backed module can be saved."
LldbSessionClearWhileRunning = "Stop the target before clearing its saved session."
LldbSessionClearNativeFailed = "The saved session was cleared, but LLDB could not remove a live breakpoint. It will not be saved again."
LldbSessionStaleAddress = "The target or session changed, or is not stopped; select the instruction again before editing its comment."
