name: CI

on:
  push:
    branches: [main]
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu dpkg build
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CMAKE_PREFIX_PATH: /usr/lib/llvm-18
      LDFLAGS: -fuse-ld=lld
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enable Ubuntu universe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
      - name: Install build packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake ninja-build git pkg-config curl \
            gcc-14 g++-14 python3 python3-dev python3-venv lldb-18 liblldb-18-dev clang clang-18 lld lld-18 \
            libgl-dev libpng-dev libbz2-dev dpkg-dev
      - name: Select LLDB debug server
        run: |
          lldb_server="$(python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          candidates = [
              "/usr/lib/llvm-18/bin/lldb-server",
              shutil.which("lldb-server-18"),
              "/usr/bin/lldb-server-18",
              shutil.which("lldb-server"),
          ]
          for candidate in candidates:
              if candidate and Path(candidate).is_file() and os.access(candidate, os.X_OK):
                  print(candidate)
                  break
          else:
              raise SystemExit("no executable lldb-server found")
          PY
          )"
          lldb_exe="$(command -v lldb-18 || command -v lldb)"
          sudo ln -sf "${lldb_exe}" "/usr/local/bin/lldb"
          lldb_version="$(python3 - "${lldb_exe}" <<'PY'
          import re
          import subprocess
          import sys

          text = subprocess.check_output([sys.argv[1], "--version"], text=True)
          match = re.search(r"lldb version ([0-9][^\\s]*)", text)
          if not match:
              raise SystemExit(f"unable to parse lldb version from: {text!r}")
          print(match.group(1))
          PY
          )"
          sudo mkdir -p "/usr/lib/llvm-18/libexec" "/usr/lib/llvm-18/lib"
          link_lldb_server() {
            dest="$1"
            if [ "$(readlink -f "${dest}" 2>/dev/null || true)" = "$(readlink -f "${lldb_server}")" ]; then
              return 0
            fi
            sudo ln -sf "${lldb_server}" "${dest}"
          }
          for server_name in "lldb-server" "lldb-server-${lldb_version}" "lldb-server-18.1.3"; do
            link_lldb_server "/usr/local/bin/${server_name}"
            link_lldb_server "/usr/bin/${server_name}"
            link_lldb_server "$(dirname "${lldb_server}")/${server_name}"
            link_lldb_server "/usr/lib/llvm-18/libexec/${server_name}"
            link_lldb_server "/usr/lib/llvm-18/lib/${server_name}"
          done
          echo "Using ${lldb_server} as lldb-server and lldb-server-${lldb_version}"
      - name: Install SDL build packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libxtst-dev libibus-1.0-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libdecor-0-dev liburing-dev
      - name: Build SDL3
        timeout-minutes: 10
        run: ./scripts/build-sdl3-ci.sh
      - name: Build analysis dependencies
        timeout-minutes: 20
        run: ./scripts/bootstrap-analysis-deps.sh
      - name: Configure
        run: |
          set +e
          cmake --preset native-dev 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path("configure.log").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-120:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Configure failed::{escaped}")
          PY
          fi
          exit "${status}"
      - name: Upload configure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-configure-log
          path: configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset native-dev --parallel 1 --verbose 2>&1 | tee build-native.log
      - name: Upload native build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: build-native.log
      - name: Test
        run: |
          set +e
          LLDB_DEBUGSERVER_PATH=/usr/lib/llvm-18/bin/lldb-server-18.1.3 ctest --preset native-dev --output-on-failure --verbose 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("test.log").read_text(errors="replace").splitlines()
          failed = [index for index, line in enumerate(lines) if "***Failed" in line]
          if failed:
              spans = []
              for index in failed:
                  spans.append((max(0, index - 35), min(len(lines), index + 35)))
              selected = []
              cursor = -1
              for start, end in spans:
                  if start <= cursor:
                      start = cursor
                  selected.extend(lines[start:end])
                  cursor = end
              text = "\n".join(selected)
          else:
              text = "\n".join(lines[-80:])
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=CTest failed::{escaped}")
          PY
          fi
          exit "${status}"
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-log
          path: test.log
      - name: Configure release package
        run: cmake --preset release -DCMAKE_INSTALL_PREFIX=/
      - name: Build release package
        run: |
          set -o pipefail
          cmake --build --preset release --parallel 1 --verbose 2>&1 | tee build-release.log
      - name: Package deb
        run: |
          mkdir -p dist
          cpack --config build/release/CPackConfig.cmake \
            -D CPACK_PACKAGE_VERSION="0.5" \
            -D CPACK_PACKAGE_FILE_NAME="mydbg-0.5-$(dpkg --print-architecture)" \
            -B dist
      - name: Smoke install deb
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/mydbg
          test -x /opt/mydbg/mydbg
          test -d /opt/mydbg/manual
          test -d /opt/mydbg/locales
          test -d /opt/mydbg/deps/lib/rizin/plugins/rz_ghidra_sleigh
